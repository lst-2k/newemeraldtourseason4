<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>League Admin - Tournament Manager</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --emerald-primary: #00a86b;
            --emerald-dark: #007a4d;
            --emerald-bg: #e6f7f0;
        }
        body { font-family: 'Segoe UI', sans-serif; background: var(--emerald-bg); padding: 20px; color: #1a3326; }
        .admin-card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); max-width: 1150px; margin: auto; border-top: 6px solid var(--emerald-primary); }
        .setup-row { display: flex; gap: 15px; margin-bottom: 20px; align-items: flex-end; flex-wrap: wrap; }
        .field { display: flex; flex-direction: column; }
        label { font-size: 11px; font-weight: bold; margin-bottom: 5px; color: var(--emerald-dark); text-transform: uppercase; letter-spacing: 0.5px; }
        input, select { padding: 8px; border: 1px solid #bce3d2; border-radius: 6px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; border-radius: 8px; overflow: hidden; white-space: nowrap; }
        th { background: var(--emerald-primary); color: white; padding: 12px; font-size: 11px; text-transform: uppercase; }
        td { padding: 8px; border-bottom: 1px solid #edf2f7; text-align: center; }
        .score-input { width: 50px; text-align: center; border: 1px solid #bce3d2; padding: 5px; border-radius: 4px; }
        .stat-input { width: 90px; text-align: center; border: 1px solid #bce3d2; padding: 5px; border-radius: 4px; }
        .btn { padding: 10px 15px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-add { background: var(--emerald-primary); color: white; }
        .btn-add:hover { background: var(--emerald-dark); }
        .btn-export { background: #ffd700; color: #000; }
        .btn-clear { background: #ff5252; color: white; }
    </style>
</head>
<body>

<div class="admin-card">
    <h2 style="margin-top:0; color:var(--emerald-dark);">⛳ Tournament Admin Panel</h2>
    <div class="setup-row">
        <div class="field" style="flex: 2;"><label>Venue Name</label><input type="text" id="venueName" placeholder="Venue Name..." oninput="saveToLocal()"></div>
        <div class="field" style="flex: 1.5;">
            <label>Tournament Dates</label>
            <div style="display: flex; gap: 5px; align-items: center;">
                <input type="date" id="startDate" oninput="saveToLocal()">
                <span style="font-size: 10px; font-weight: bold; color: #777;">TO</span>
                <input type="date" id="endDate" oninput="saveToLocal()">
            </div>
        </div>
        <div class="field"><label>Prize Fund ($)</label><input type="number" id="purseVal" value="1000000" step="50000" oninput="saveToLocal()"></div>
        <div class="field"><label>Par</label><input type="number" id="coursePar" value="72" oninput="updateAllRows()"></div>
        <div class="field"><label>Signature Event</label><input type="checkbox" id="isSig" onchange="saveToLocal()"></div>
    </div>

    <div style="margin-bottom: 20px; display: flex; gap: 10px; align-items: center; background: #dff5eb; padding: 15px; border-radius: 8px;">
        <input type="text" id="newPlayerName" placeholder="New Player Name...">
        <select id="newPlayerConsole">
            <option value="PS">PlayStation</option>
            <option value="Xbox">Xbox</option>
            <option value="PC">PC</option>
        </select>
        <button class="btn btn-add" onclick="addPlayer()">Add Player</button>
        <button class="btn btn-clear" style="margin-left: auto;" onclick="clearAllScores()">Clear All Scores</button>
    </div>

    <table id="playerTable">
        <thead>
            <tr>
                <th>Del</th>
                <th style="text-align:left;">Player Name</th>
                <th>R1</th>
                <th>R2</th>
                <th>Total</th>
                <th>To Par</th>
                <th>Longest Drive</th>
                <th>Greens in Reg</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <div style="display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap;">
        <button class="btn" style="background:var(--emerald-primary); color:white;" onclick="refreshTable()">Sort Board</button>
        <button class="btn btn-export" onclick="exportJSON()">End & Archive Tournament</button>
        <button class="btn" style="background:#ffa726; color:white;" onclick="undoLastTournament()">Undo Last Export</button>
        <button class="btn" style="background:#ef5350; color:white;" onclick="resetSeason()">Full Season Reset</button>
        <button class="btn" style="background:#455a64; color:white;" onclick="document.getElementById('importFile').click()">Import data.json</button>
        <input type="file" id="importFile" style="display:none;" onchange="importJSON(this)">
    </div>
</div>

<script>
    const stdPtsTable = {
        1:500, 2:300, 3:190, 4:135, 5:110, 6:100, 7:90, 8:85, 9:80, 10:75,
        11:70, 12:65, 13:60, 14:57, 15:55, 16:53, 17:51, 18:49, 19:47, 20:45,
        21:43, 22:41, 23:39, 24:37, 25:35.5, 26:34, 27:32.5, 28:31, 29:29.5, 30:28,
        31:26.5, 32:25, 33:23.5, 34:22, 35:21, 36:20, 37:19, 38:18, 39:17, 40:16
    };

    const sigPtsTable = {
        1:750, 2:500, 3:350, 4:325, 5:300, 6:270, 7:250, 8:225, 9:200, 10:175,
        11:155, 12:135, 13:115, 14:105, 15:95, 16:85, 17:75, 18:70, 19:65, 20:60,
        21:55, 22:53, 23:51, 24:49, 25:47, 26:45, 27:43, 28:41, 29:39, 30:37,
        31:35, 32:33, 33:31, 34:29, 35:27, 36:26, 37:25, 38:24, 39:23, 40:22
    };

    const payoutPercentages = {
        1: 0.180, 2: 0.109, 3: 0.069, 4: 0.049, 5: 0.041, 6: 0.03625, 7: 0.03375, 8: 0.03125, 9: 0.02925, 10: 0.02725,
        11: 0.02525, 12: 0.02325, 13: 0.02125, 14: 0.01925, 15: 0.01825, 16: 0.01725, 17: 0.01625, 18: 0.01525, 19: 0.01425, 20: 0.01325,
        21: 0.01225, 22: 0.01125, 23: 0.01045, 24: 0.00965, 25: 0.00885, 26: 0.00805, 27: 0.00775, 28: 0.00745, 29: 0.00715, 30: 0.00685,
        31: 0.00655, 32: 0.00625, 33: 0.00595, 34: 0.00570, 35: 0.00545, 36: 0.00520, 37: 0.00495, 38: 0.00475, 39: 0.00455, 40: 0.00435
    };

    function getSinglePositionPts(pos, isSig) {
        const table = isSig ? sigPtsTable : stdPtsTable;
        if (table[pos] !== undefined) return table[pos];
        return Math.max(1, (isSig ? 22 : 16) - (pos - 40));
    }

    function calculatePtsInternalSplit(firstRank, tiedCount, isSig, ldBonus, girBonus) {
        let sum = 0;
        for (let r = firstRank; r < firstRank + tiedCount; r++) {
            sum += getSinglePositionPts(r, isSig);
        }
        let baseAvg = sum / tiedCount;
        return Math.round((baseAvg + ldBonus + girBonus) * 10) / 10;
    }

    function calculatePrizeSplit(firstRank, tiedCount, purse) {
        if (!purse || purse <= 0) return 0;
        let pctSum = 0;
        for (let r = firstRank; r < firstRank + tiedCount; r++) {
            pctSum += payoutPercentages[r] || 0.003;
        }
        let avgPct = pctSum / tiedCount;
        return Math.round(purse * avgPct);
    }

    function parseNumericStat(val) {
        if (val === undefined || val === null) return 0;
        const num = parseFloat(val.toString().replace(/[^0-9.]/g, ''));
        return isNaN(num) ? 0 : num;
    }

    function exportJSON() {
        refreshTable();
        let stored = JSON.parse(localStorage.getItem('golfAdminData')) || {};
        stored.backupSeason = JSON.parse(JSON.stringify(stored.season || {}));
        stored.backupHistory = stored.history || "";
        
        let currentStandings = [];
        if (stored.season) {
            currentStandings = Object.entries(stored.season).map(([name, info]) => ({ name, points: info.points })).sort((a, b) => b.points - a.points);
        }

        const venueVal = document.getElementById('venueName').value;
        const sDate = document.getElementById('startDate').value;
        const eDate = document.getElementById('endDate').value;
        const dateRange = (sDate && eDate) ? `${sDate} to ${eDate}` : (sDate || eDate || "TBD");
        const isSig = document.getElementById('isSig').checked;
        const parVal = parseInt(document.getElementById('coursePar').value);
        const purseVal = parseFloat(document.getElementById('purseVal').value) || 1000000;
        
        const playersForExport = Array.from(document.querySelectorAll('#playerTable tbody tr')).map(row => {
            const s = [row.querySelector('.r1').value, row.querySelector('.r2').value].map(v => parseInt(v)||0).filter(v => v > 0);
            const tot = s.reduce((a,b)=>a+b,0);
            const ldRaw = row.querySelector('.ld-input').value;
            const girRaw = row.querySelector('.gir-input').value;
            return { 
                name: row.querySelector('.p-name').value, 
                console: row.querySelector('.p-console').value, 
                r1: row.querySelector('.r1').value, 
                r2: row.querySelector('.r2').value,
                total: tot, 
                ldYardage: ldRaw, 
                girVal: girRaw,
                numLd: parseNumericStat(ldRaw),
                numGir: parseNumericStat(girRaw),
                toParVal: s.length > 0 ? tot - (s.length * parVal) : 999 
            };
        });

        let maxLd = 0;
        let maxGir = 0;
        playersForExport.forEach(p => {
            if (p.total > 0) {
                if (p.numLd > maxLd) maxLd = p.numLd;
                if (p.numGir > maxGir) maxGir = p.numGir;
            }
        });

        let ldWinnersCount = maxLd > 0 ? playersForExport.filter(p => p.total > 0 && p.numLd === maxLd).length : 0;
        let girWinnersCount = maxGir > 0 ? playersForExport.filter(p => p.total > 0 && p.numGir === maxGir).length : 0;

        let season = stored.season || {};
        let histRows = "";
        const processedPlayers = [...playersForExport].sort((a,b) => a.toParVal - b.toParVal);
        
        processedPlayers.forEach((p, i) => {
            if (p.total > 0) {
                let firstIdx = i;
                while (firstIdx > 0 && processedPlayers[firstIdx - 1].toParVal === p.toParVal) firstIdx--;
                
                let tiedCount = 0;
                while (firstIdx + tiedCount < processedPlayers.length && processedPlayers[firstIdx + tiedCount].toParVal === p.toParVal) {
                    tiedCount++;
                }

                const isTied = tiedCount > 1;
                const actualRank = firstIdx + 1;

                if (!season[p.name]) {
                    season[p.name] = { points: 0, console: p.console, eventsPlayed: 0, wins: 0, acc: 0, form: [], history: [], bestToPar: 999, bestTotal: 999, maxLd: 0, totalGir: 0, earnings: 0 };
                }
                
                const oldRankIndex = currentStandings.findIndex(s => s.name === p.name);
                season[p.name].prevRank = oldRankIndex !== -1 ? oldRankIndex + 1 : currentStandings.length + 1;

                if (firstIdx === 0) season[p.name].wins = (season[p.name].wins || 0) + 1;
                season[p.name].acc = (season[p.name].acc || 0) + p.toParVal;
                
                if (p.numLd > (season[p.name].maxLd || 0)) {
                    season[p.name].maxLd = p.numLd;
                }
                season[p.name].totalGir = (season[p.name].totalGir || 0) + p.numGir;

                const isLdWinner = maxLd > 0 && p.numLd === maxLd;
                const isGirWinner = maxGir > 0 && p.numGir === maxGir;
                const ldBonus = isLdWinner ? (50 / ldWinnersCount) : 0;
                const girBonus = isGirWinner ? (50 / girWinnersCount) : 0;

                const gainedPts = calculatePtsInternalSplit(actualRank, tiedCount, isSig, ldBonus, girBonus);
                season[p.name].points = Math.round(((season[p.name].points || 0) + gainedPts) * 10) / 10;
                
                const prizeCash = calculatePrizeSplit(actualRank, tiedCount, purseVal);
                season[p.name].earnings = (season[p.name].earnings || 0) + prizeCash;

                season[p.name].eventsPlayed = (season[p.name].eventsPlayed || 0) + 1;
                
                if (!season[p.name].form) season[p.name].form = [];
                season[p.name].form.unshift(actualRank);
                if (season[p.name].form.length > 5) season[p.name].form.pop();

                if (!season[p.name].history) season[p.name].history = [];
                season[p.name].history.unshift({
                    date: dateRange,
                    venue: venueVal || "Tournament",
                    gross: p.total,
                    toPar: p.toParVal,
                    pos: isTied ? `T${actualRank}` : `${actualRank}`
                });

                const currentBestToPar = season[p.name].bestToPar !== undefined ? season[p.name].bestToPar : 999;
                const isNewBestToPar = p.toParVal < currentBestToPar;
                const isTieTiebreaker = (p.toParVal === currentBestToPar) && (p.total < (season[p.name].bestTotal || 999));

                if (isNewBestToPar || isTieTiebreaker) {
                    season[p.name].bestToPar = p.toParVal;
                    season[p.name].bestTotal = p.total;
                    season[p.name].bestVenue = venueVal || "Tournament";
                    season[p.name].bestDate = dateRange;
                }

                const tp = p.toParVal===0?'E':(p.toParVal>0?'+'+p.toParVal:p.toParVal);
                const rank = isTied ? `T${actualRank}` : actualRank;
                histRows += `<tr><td>${rank}</td><td>${p.name}</td><td>${tp}</td><td>${p.total}</td></tr>`;
            }
        });

        const finalData = { 
            ...stored, 
            venue: venueVal, date: dateRange, startDate: sDate, endDate: eDate, par: parVal, purse: purseVal, isSig: isSig, players: playersForExport, season, 
            history: (stored.history || "") + `<div class="history-header" onclick="toggleHistory(this)">${venueVal} (${dateRange}) ${isSig?'🏆':''}</div><div class="history-content"><table><tr><th>Pos</th><th>Player</th><th>Par</th><th>Tot</th></tr>${histRows}</table></div>` 
        };
        
        localStorage.setItem('golfAdminData', JSON.stringify(finalData));
        const blob = new Blob([JSON.stringify(finalData, null, 2)], {type : 'application/json'});
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'data.json'; a.click();
        alert("Archive Complete!");
    }

    function addPlayer(p = {}) {
        const name = p.name || document.getElementById('newPlayerName').value;
        const consoleVal = p.console || document.getElementById('newPlayerConsole').value;
        if (!name) return;
        const tbody = document.querySelector('#playerTable tbody');
        const row = tbody.insertRow();
        row.innerHTML = `
            <td><button style="color:red; background:none; border:none; cursor:pointer;" onclick="this.closest('tr').remove(); saveToLocal();">✖</button></td>
            <td style="text-align:left;"><input type="text" class="p-name" value="${name}" style="border:none; font-weight:bold; width:180px; background:transparent;" oninput="saveToLocal()"><input type="hidden" class="p-console" value="${consoleVal}"></td>
            <td><input type="number" class="score-input r1" value="${p.r1||''}" oninput="updateRow(this)"></td>
            <td><input type="number" class="score-input r2" value="${p.r2||''}" oninput="updateRow(this)"></td>
            <td><input type="text" class="total" value="0" readonly style="width:40px; border:none; text-align:center; background:transparent; font-weight:bold;"></td>
            <td><input type="text" class="topar" value="E" readonly style="width:40px; border:none; text-align:center; background:transparent; font-weight:bold;"></td>
            <td><input type="text" class="stat-input ld-input" placeholder="e.g. 312.5" value="${p.ldYardage !== undefined ? p.ldYardage : ''}" oninput="saveToLocal()"></td>
            <td><input type="text" class="stat-input gir-input" placeholder="e.g. 14" value="${p.girVal !== undefined ? p.girVal : ''}" oninput="saveToLocal()"></td>
        `;
        document.getElementById('newPlayerName').value = ''; updateRow(row.querySelector('.r1')); saveToLocal();
    }

    function updateRow(input) {
        const row = input.closest('tr');
        const par = parseInt(document.getElementById('coursePar').value) || 72;
        const s = [row.querySelector('.r1').value, row.querySelector('.r2').value].map(v => parseInt(v)||0).filter(v => v > 0);
        const total = s.reduce((a, b) => a + b, 0);
        const toPar = s.length > 0 ? total - (s.length * par) : 0;
        row.querySelector('.total').value = total || 0;
        row.querySelector('.topar').value = toPar === 0 ? "E" : (toPar > 0 ? `+${toPar}` : toPar);
        saveToLocal();
    }

    function updateAllRows() { document.querySelectorAll('.score-input.r1').forEach(i => updateRow(i)); }

    function saveToLocal() {
        const players = Array.from(document.querySelectorAll('#playerTable tbody tr')).map(row => ({
            name: row.querySelector('.p-name').value, console: row.querySelector('.p-console').value,
            r1: row.querySelector('.r1').value, r2: row.querySelector('.r2').value,
            ldYardage: row.querySelector('.ld-input').value, girVal: row.querySelector('.gir-input').value
        }));
        const existing = JSON.parse(localStorage.getItem('golfAdminData')) || {};
        localStorage.setItem('golfAdminData', JSON.stringify({
            ...existing, venue: document.getElementById('venueName').value, startDate: document.getElementById('startDate').value, endDate: document.getElementById('endDate').value, par: document.getElementById('coursePar').value, purse: document.getElementById('purseVal').value, isSig: document.getElementById('isSig').checked, players
        }));
    }

    function refreshTable() {
        const tbody = document.querySelector('#playerTable tbody');
        const rows = Array.from(tbody.rows).sort((a, b) => {
            const getVal = r => {
                const val = r.querySelector('.topar').value;
                if (val === "E") return 0;
                return parseInt(val.replace('+', '')) || 999;
            };
            return getVal(a) - getVal(b);
        });
        rows.forEach(r => tbody.appendChild(r));
    }

    function clearAllScores() {
        if(!confirm("Wipe scores?")) return;
        document.querySelectorAll('#playerTable tbody tr').forEach(row => {
            row.querySelector('.r1').value = ''; row.querySelector('.r2').value = '';
            row.querySelector('.ld-input').value = ''; row.querySelector('.gir-input').value = '';
            updateRow(row.querySelector('.r1'));
        });
        saveToLocal();
    }

    function resetSeason() { if (confirm("Delete ALL history?")) { localStorage.clear(); location.reload(); } }

    function undoLastTournament() { 
        let s = JSON.parse(localStorage.getItem('golfAdminData')); 
        if(confirm("Undo last export?")) { s.season = s.backupSeason; s.history = s.backupHistory; localStorage.setItem('golfAdminData', JSON.stringify(s)); location.reload(); } 
    }

    function importJSON(input) { const reader = new FileReader(); reader.onload = e => { const data = JSON.parse(e.target.result); localStorage.setItem('golfAdminData', JSON.stringify(data)); location.reload(); }; reader.readAsText(input.files[0]); }

    window.onload = () => {
        const d = JSON.parse(localStorage.getItem('golfAdminData'));
        if(d) {
            document.getElementById('venueName').value = d.venue||''; document.getElementById('startDate').value = d.startDate||''; document.getElementById('endDate').value = d.endDate||''; document.getElementById('coursePar').value = d.par||72; document.getElementById('purseVal').value = d.purse||1000000; document.getElementById('isSig').checked = d.isSig||false;
            if(d.players) d.players.forEach(p => addPlayer(p));
        }
    };
</script>
</body>
</html>
